[build-system]
requires = ["setuptools==75.8.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "berry-esseen-local-pilot"
version = "0.1.0"
description = "A source-bound exact rational local proof pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "attrs==25.1.0",
  "jsonschema==4.23.0",
  "jsonschema-specifications==2024.10.1",
  "referencing==0.36.2",
  "rpds-py==0.23.1",
  "typing-extensions==4.15.0",
]

[project.scripts]
be = "be.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
