<a href="../docs/architecture/02-execution.md"><g id="verdict">
<rect x="1020" y="748" width="420" height="136" rx="14" fill="#eaf8f1" stroke="#a6d4be"/>
<text x="1040" y="774" class="eyebrow" style="fill:#087451">ACCEPTANCE CONTRACT</text>
<text x="1040" y="806" class="title">Final report: PASS / NO PASS</text>
<text x="1040" y="834" class="body">PASS only for the requested whole</text>
<text x="1040" y="858" class="body">Otherwise: reasons + remaining work</text>
</g></a>
<a href="../docs/architecture/03-storage-and-recovery.md"><g id="cas">
<rect x="52" y="1040" width="420" height="136" rx="14" fill="#f2f1fb" stroke="#c4bfdf"/>
<text x="72" y="1066" class="eyebrow" style="fill:#65568e">SUPPORTING AUTHORITY</text>
<text x="72" y="1098" class="title">Immutable bytes + exact cache</text>
<text x="72" y="1126" class="body">Local CAS / Cloud Storage</text>
<text x="72" y="1150" class="body">Candidates, receipts and checkpoints differ</text>
</g></a>
<a href="../docs/architecture/03-storage-and-recovery.md"><g id="ledger">
<rect x="536" y="1040" width="420" height="136" rx="14" fill="#f2f1fb" stroke="#c4bfdf"/>
<text x="556" y="1066" class="eyebrow" style="fill:#65568e">SUPPORTING AUTHORITY</text>
<text x="556" y="1098" class="title">Transactional runtime ledger</text>
<text x="556" y="1126" class="body">SQLite / Firestore; fenced attempts</text>
<text x="556" y="1150" class="body">Outbox, reservations and recovery</text>
</g></a>
<a href="../docs/architecture/05-compute-and-deployment.md"><g id="stop">
<rect x="1020" y="1040" width="420" height="136" rx="14" fill="#f2f1fb" stroke="#c4bfdf"/>
<text x="1040" y="1066" class="eyebrow" style="fill:#65568e">SUPPORTING AUTHORITY</text>
<text x="1040" y="1098" class="title">Independent stop + liability</text>
<text x="1040" y="1126" class="body">Absolute deadline; resource inventory</text>
<text x="1040" y="1150" class="body">Confirm shutdown; retain cost reserve</text>
</g></a>
<text x="52" y="1210" style="font-size:14px;fill:#615b7d">These services bind every dispatch, checkpoint, publication and resume. Resource shutdown is reported independently.</text>
<text x="52" y="1284" style="font-size:17px;font-weight:650">PASS requires the whole requested conclusion under the declared trust profile.</text>
<text x="52" y="1317" style="font-size:15px">A candidate, historical PASS, cache hit, successful VM or green conditional Lean build cannot replace missing evidence.</text>
</svg>
