<rect x="536" y="292" width="420" height="136" rx="14" fill="#edf4ff" stroke="#b5cbea"/>
<text x="556" y="318" class="eyebrow" style="fill:#285a94">EXECUTION CONTRACT</text>
<text x="556" y="350" class="title">Planner + dependency graph</text>
<text x="556" y="378" class="body">Mathematical AND / OR coverage</text>
<text x="556" y="402" class="body">Separate runtime jobs; no cycles</text>
</g></a>
<a href="../docs/architecture/05-compute-and-deployment.md"><g id="schedule">
<rect x="1020" y="292" width="420" height="136" rx="14" fill="#edf4ff" stroke="#b5cbea"/>
