<text x="72" y="318" class="eyebrow" style="fill:#285a94">EXECUTION CONTRACT</text>
<text x="72" y="350" class="title">One CLI + frozen project</text>
<text x="72" y="378" class="body">be run project.toml --resume</text>
<text x="72" y="402" class="body">Exact theorem, sources, trust and policy</text>
</g></a>
